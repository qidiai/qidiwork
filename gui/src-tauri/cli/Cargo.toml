[package]
name = "qidiwork-cli"
version = "0.1.11"
edition = "2024"
rust-version = "1.85"
description = "QidiWork 标书 CLI（导出/导入/页数/项目/冒烟/模板生成）——与 GUI 分包，不进安装包"

# 只依赖 GUI crate 的 lib target；cargo build -p qidiwork-cli 不会触发 Tauri 打包步骤。
[dependencies]
qidiwork-gui = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
