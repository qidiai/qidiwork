    channel.port1.onmessage = () => { channel.port1.close(); channel.port2.close(); resolve(); };
    channel.port2.postMessage(null);

const wait = async (condition) => {
  const deadline = Date.now() + 12000;
  while (Date.now() < deadline) { if (condition()) return; await tick(); }
  throw new Error('等待交互状态超时');
};
function assert(condition, message) { if (!condition) throw new Error(message); }
function add(items, drop = false) {

window.makeVideoFixture = async () => {
  assert(typeof MediaRecorder !== 'undefined', '浏览器不支持生成本地测试视频');
  const canvas = document.createElement('canvas'); canvas.width = 160; canvas.height = 90;
  const context = canvas.getContext('2d');
  const stream = canvas.captureStream(0);
  const track = stream.getVideoTracks()[0];
  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise((resolve, reject) => { recorder.onstop = resolve; recorder.onerror = reject; });
  try {
    recorder.start();
    for (const color of ['#ff0000', '#00ff00', '#0000ff', '#ffff00']) {
      context.fillStyle = color; context.fillRect(0, 0, 160, 90); track.requestFrame();
      await new Promise(resolve => setTimeout(resolve, 350));
    }
    recorder.stop(); await done;
    window.videoFixture = new File(chunks, '画面测试.webm', { type: 'video/webm' });
    return { size: window.videoFixture.size, type: window.videoFixture.type };
  } finally { stream.getTracks().forEach(t => t.stop()); }
};

window.runMediaChecks = async () => {
  const passed = [];
  const media = await import('../src/services/media');
  assert(window.videoFixture, '请先生成测试视频');
  const video = window.videoFixture;
  const analysis = await media.extractVideoFrames(video);
  assert(analysis.frames.length > 0 && analysis.frames.length <= 6 && Number.isFinite(analysis.duration), '抽帧数量及时长必须真实有效');
  const colors = [];
  for (const frame of analysis.frames) {
    const image = new Image(); image.src = `data:${frame.mimeType};base64,${frame.data}`; await image.decode();
    assert(image.naturalWidth > 0 && image.naturalWidth <= 1280 && image.naturalHeight <= 1280, '每帧须是可解码且限尺寸的图片');
    const canvas = document.createElement('canvas'); canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
    const ctx = canvas.getContext('2d'); ctx.drawImage(image, 0, 0); colors.push([...ctx.getImageData(5, 5, 1, 1).data].slice(0, 3));
    assert(frame.timestamp > 0 && frame.timestamp < analysis.duration, '采样时间必须落在真实时长内');
  }
  assert(colors.some(c => c.some(v => v > 150)), '不能把黑帧当成成功');
  if (colors.length > 1) assert(new Set(colors.map(c => c.join(','))).size > 1, '不同时间必须取得不同画面而非重复首帧');
  passed.push(`真实视频解码并抽取 ${analysis.frames.length} 张可读画面`);
  const id = await agent.startSession(); await tick();
  add([video], true); type('分析这段视频的画面'); await tick();
  assert(document.querySelector('video.attachment-preview') && document.querySelector('.media-notice').textContent.includes('不含声音'), '发送前必须可预览并说明视频限制');
  for (const width of [1280, 960]) {
    document.documentElement.style.width = `${width}px`; await tick();

    assert(document.querySelector('.model-controls').getBoundingClientRect().bottom <= bottom, `宽度${width}模型控件不能被裁切`);
  }
  document.documentElement.style.width = '1280px';
  const before = state.calls.filter(c => c.cmd === 'session_prompt').length;
  send(); await wait(() => state.calls.filter(c => c.cmd === 'session_prompt').length > before);
  const prompt = state.calls.filter(c => c.cmd === 'session_prompt').at(-1).args;
  assert(prompt.images.length === analysis.frames.length && prompt.images.every(i => i.mimeType === 'image/jpeg'), '视频必须走真实图片块发送');
  assert(prompt.text.includes('时间点') && prompt.text.includes('不含声音') && prompt.text.includes('未发送原视频'), '提示词不能把抽帧伪装成完整视频');
  assert(!state.calls.some(c => c.cmd === 'session_import_document' && c.args.name === video.name), '不能把视频原片偷偷导入并声称已经分析');
  await complete(id); passed.push('拖入、预览、限制提示、真实图片块下发闭环');
  add([new File(['not video'], '损坏.mp4', { type: 'video/mp4' })]); type('检查视频'); await tick();
  const beforeInvalid = state.calls.filter(c => c.cmd === 'session_prompt').length;
  send(); await wait(() => document.querySelector('.attach-error')?.textContent.includes('视频'));
  assert(state.calls.filter(c => c.cmd === 'session_prompt').length === beforeInvalid && document.querySelector('.attachment-chip'), '坏视频必须保留附件且不能静默发送');
  document.querySelector('.attachment-chip button').click(); await tick();
  const controller = new AbortController(); controller.abort();
  let aborted = false; try { await media.extractVideoFrames(video, controller.signal); } catch (e) { aborted = e.name === 'AbortError'; }
  assert(aborted, '取消必须终止抽帧');
  add([video]); await tick(); send(); await tick();
  document.querySelector('.preparation-status button')?.click();
  await wait(() => document.querySelector('.attach-error')?.textContent.includes('已取消准备'));
  assert(document.querySelector('.attachment-chip'), '取消后保留原附件');
  document.querySelector('.attachment-chip button').click(); await tick();
  passed.push('损坏视频和取消准备不丢附件、不发送部分画面');
  add([new File([new Uint8Array(media.MAX_VIDEO_BYTES + 1)], '过大.mp4')]); await tick();
  assert(document.querySelector('.attach-error').textContent.includes('100MB') && !document.querySelector('.attachment-chip'), '超大视频必须提前拒绝');
  add([new File([video], '一.webm'), new File([video], '二.webm'), new File([video], '三.webm')]); await tick();
  assert(document.querySelectorAll('.attachment-chip').length === 2 && document.querySelector('.attach-error').textContent.includes('画面过多'), '不能越过内核16张图片处理上限');
  for (const button of document.querySelectorAll('.attachment-chip button')) button.click(); await tick();
  const img = imageFile('粘贴图片.png'); const transfer = new DataTransfer(); transfer.items.add(img);
  document.querySelector('.composer-input').dispatchEvent(new ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: transfer })); await tick();
  await wait(() => document.querySelector('img.attachment-preview')?.naturalWidth > 0);
  assert(document.querySelector('.attachment-name').textContent === img.name, '粘贴图片必须提供真实预览');
  document.querySelector('.attachment-chip button').click(); await tick();
  passed.push('视频大小与画面预算限制，图片粘贴和预览');
  window.mediaResults = { passed, duration: analysis.duration, colors };
  return window.mediaResults;
};
